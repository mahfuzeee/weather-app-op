<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
  </head>
  <body>
    <main>
      <h1>Weather</h1>
      <form id="form">
        <input
          id="q"
          type="search"
          placeholder="Search for a city"
          aria-label="City name"
          autocomplete="off"
          required
        />
        <button id="btn" type="submit">Search</button>
      </form>
      <div id="status">Enter a city to see its weather.</div>
      <section id="out" hidden>
        <div class="current">
          <div class="icon" id="cIcon"></div>
          <div>
            <div class="place" id="place"></div>
            <div class="temp" id="temp"></div>
            <div class="cond" id="cond"></div>
          </div>
          <div class="stats">
            <div class="stat"><span>Wind</span><strong id="wind"></strong></div>
            <div class="stat">
              <span>Rain now</span><strong id="rainNow"></strong>
            </div>
            <div class="stat">
              <span>Rain chance today</span><strong id="rainChance"></strong>
            </div>
          </div>
        </div>
        <div class="days" id="days"></div>
      </section>
    </main>
  </body>
</html>
